name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Compile all
        run: python -m compileall -q .

      - name: Mypy (strict set)
        # PR10: strict-проверка ограничена набором pure-модулей из
        # pyproject.toml [[tool.mypy.overrides]] — список «эталонов
        # типизации», на которые равняемся при расширении набора.
        # Полная проверка всего репо НЕ запускается, чтобы legacy
        # не блокировал PR-ы по новому коду.
        run: |
          mypy \
            core/monitor_state.py \
            scripts/bump_version.py \
            modules/mail_parts/db/schema.py \
            core/monitor_parts/alerts.py \
            core/monitor_parts/availability.py \
            core/monitor_parts/resource_checks.py

      - name: Pytest (smoke, no runtime deps)
        # Сейчас CI прогоняет только лёгкие smoke-тесты, не требующие
        # paramiko/telegram/matrix-nio. Полный smoke-импорт по
        # core.monitor_core / bot.handlers / modules.mail_monitor добавится
        # в отдельном PR вместе с настройкой apt/pip установки runtime.
        run: pytest

  android-build:
    # Сборка ComDone APK: ловит ошибки Kotlin/Gradle до публикации релиза.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Assemble release APK
        # Временный ключ только для проверки сборки: настоящий ключ подписи
        # хранится у разработчика (см. docs/development.md), в CI его нет.
        working-directory: android-client
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=ComDone CI"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -PCOMDONE_KEYSTORE_FILE="$RUNNER_TEMP/ci.keystore"

      - name: Check APK file name
        run: ls android-client/app/build/outputs/apk/release/ComDone-*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ComDone-apk
          path: android-client/app/build/outputs/apk/release/ComDone-*.apk
          retention-days: 7
